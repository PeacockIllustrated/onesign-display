<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>Onesign Display</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        #setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 4rem;
            text-align: center;
        }
        #setup h1 {
            font-size: 4rem;
            margin: 0 0 0.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #setup .accent { color: #4e7e8c; }
        #setup p {
            font-size: 1.75rem;
            color: #aaa;
            margin: 0 0 3rem;
        }
        #setup input {
            font-size: 2.5rem;
            padding: 1.25rem 2rem;
            width: 720px;
            background: #1a1a1a;
            color: #fff;
            border: 3px solid #333;
            border-radius: 0.5rem;
            text-align: center;
            letter-spacing: 0.1em;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            text-transform: uppercase;
        }
        #setup input:focus {
            outline: none;
            border-color: #4e7e8c;
            box-shadow: 0 0 0 6px rgba(78, 126, 140, 0.25);
        }
        #setup button {
            font-size: 2rem;
            padding: 1.25rem 4rem;
            margin-top: 2rem;
            background: #4e7e8c;
            color: #fff;
            border: 3px solid #4e7e8c;
            border-radius: 0.5rem;
            cursor: pointer;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #setup button:focus {
            outline: none;
            background: #5fa0b1;
            border-color: #95daf8;
            box-shadow: 0 0 0 6px rgba(149, 218, 248, 0.25);
        }
        #setup .footer {
            margin-top: 4rem;
            font-size: 1rem;
            color: #666;
        }
        #reset-confirm {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #reset-confirm.visible { display: flex; }
        #reset-confirm .box {
            background: #1a1a1a;
            padding: 3rem 4rem;
            border-radius: 0.5rem;
            border: 2px solid #4e7e8c;
            text-align: center;
        }
        #reset-confirm h2 { margin: 0 0 1rem; font-size: 2rem; }
        #reset-confirm p { margin: 0 0 2rem; color: #aaa; font-size: 1.25rem; }
        #reset-confirm button {
            font-size: 1.5rem;
            padding: 0.75rem 2rem;
            margin: 0 0.5rem;
            border: 3px solid #444;
            background: #222;
            color: #fff;
            border-radius: 0.5rem;
            cursor: pointer;
        }
        #reset-confirm button.danger { border-color: #c53030; }
        #reset-confirm button:focus {
            outline: none;
            box-shadow: 0 0 0 6px rgba(149, 218, 248, 0.25);
            border-color: #95daf8;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="reset-confirm">
        <div class="box">
            <h2>Reset pairing token?</h2>
            <p>The TV will need to be paired again before content will play.</p>
            <button id="reset-cancel">Cancel</button>
            <button id="reset-confirm-btn" class="danger">Reset</button>
        </div>
    </div>
    <script>
        var TOKEN_KEY = 'onesign_player_token';
        var PLAYER_BASE = 'https://onesign-display.vercel.app/player/';
        var HOLD_MS = 5000;

        // ── Wake Lock: best-effort, gracefully degrades on older WebOS ──
        function setupWakeLock() {
            if (!('wakeLock' in navigator)) return;
            var lock = null;
            var acquire = function () {
                navigator.wakeLock.request('screen')
                    .then(function (l) { lock = l; })
                    .catch(function (e) { console.warn('[WakeLock] failed', e); });
            };
            acquire();
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') acquire();
            });
            setInterval(function () {
                if (!lock || lock.released) acquire();
            }, 5 * 60 * 1000);
        }

        // ── Re-pair gesture: long-press any remote key for 5 seconds ──
        var keyHoldTimer = null;
        var resetShown = false;
        document.addEventListener('keydown', function (e) {
            if (resetShown) return;
            if (keyHoldTimer) return;
            keyHoldTimer = setTimeout(function () {
                showResetConfirm();
            }, HOLD_MS);
        });
        document.addEventListener('keyup', function () {
            if (keyHoldTimer) {
                clearTimeout(keyHoldTimer);
                keyHoldTimer = null;
            }
        });

        function showResetConfirm() {
            resetShown = true;
            var modal = document.getElementById('reset-confirm');
            modal.classList.add('visible');
            var cancel = document.getElementById('reset-cancel');
            var confirm = document.getElementById('reset-confirm-btn');
            cancel.focus();

            var close = function () {
                modal.classList.remove('visible');
                resetShown = false;
                cancel.removeEventListener('click', onCancel);
                confirm.removeEventListener('click', onConfirm);
            };
            var onCancel = function () { close(); };
            var onConfirm = function () {
                localStorage.removeItem(TOKEN_KEY);
                location.reload();
            };
            cancel.addEventListener('click', onCancel);
            confirm.addEventListener('click', onConfirm);

            // Arrow key navigation between buttons
            var onKey = function (e) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                    if (document.activeElement === cancel) confirm.focus();
                    else cancel.focus();
                    e.preventDefault();
                } else if (e.key === 'Escape' || e.keyCode === 461) {
                    close();
                    e.preventDefault();
                    e.stopPropagation();
                }
            };
            document.addEventListener('keydown', onKey);
        }

        // ── Back-button suppression (WebOS keyCode 461) ──
        document.addEventListener('keydown', function (e) {
            if ((e.keyCode === 461 || e.key === 'Backspace') && !resetShown) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // ── Setup screen ──
        function showSetup() {
            document.getElementById('root').innerHTML =
                '<div id="setup">' +
                    '<h1><span class="accent">Onesign</span> Display</h1>' +
                    '<p>Enter your pairing token to begin</p>' +
                    '<input id="tokenInput" type="text" placeholder="TOKEN" autofocus autocomplete="off" />' +
                    '<button id="connectBtn">Connect</button>' +
                    '<p class="footer">Hold any remote button for 5 seconds to reset this device</p>' +
                '</div>';

            var input = document.getElementById('tokenInput');
            var btn = document.getElementById('connectBtn');
            setTimeout(function () { input.focus(); }, 0);

            var connect = function () {
                var token = input.value.trim();
                if (!token) return;
                localStorage.setItem(TOKEN_KEY, token);
                loadPlayer(token);
            };

            btn.addEventListener('click', connect);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { connect(); e.preventDefault(); }
                if (e.key === 'ArrowDown') { btn.focus(); e.preventDefault(); }
            });
            btn.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowUp') { input.focus(); e.preventDefault(); }
                if (e.key === 'Enter') { connect(); e.preventDefault(); }
            });
        }

        // ── Player iframe ──
        function loadPlayer(token) {
            setupWakeLock();
            var iframe = document.createElement('iframe');
            iframe.src = PLAYER_BASE + encodeURIComponent(token);
            iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
            iframe.setAttribute('allowfullscreen', 'true');
            var root = document.getElementById('root');
            root.innerHTML = '';
            root.appendChild(iframe);
        }

        // ── Boot ──
        var storedToken = localStorage.getItem(TOKEN_KEY);
        if (storedToken) {
            loadPlayer(storedToken);
        } else {
            showSetup();
        }
    </script>
</body>
</html>
